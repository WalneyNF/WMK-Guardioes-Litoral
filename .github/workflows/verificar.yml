name: Verificações estáticas WMK
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/validar.js
      - run: node --test tests/terrestres.test.js
      - run: node --test tests/editor-veiculos.test.js
